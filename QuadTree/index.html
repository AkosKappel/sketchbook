<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuadTree · Mini Projects</title>
    <link rel="icon" href="../shared/favicon.svg" />
    <link rel="stylesheet" href="../shared/base.css" />
    <script defer src="../lib/p5.min.js"></script>
    <script defer src="../shared/fit-canvas.js"></script>
    <script defer src="quadtree.js"></script>
    <script defer src="sketch.js"></script>
  </head>
  <body class="project">
    <header class="topbar">
      <a class="back" href="../">← All projects</a>
      <h1>QuadTree</h1>
      <span class="stat">Points <output id="total">0</output></span>
      <span class="stat">Found <output id="found">0</output></span>
      <span class="stat">Checked <output id="checked">0</output></span>
      <p class="hint">Move or drag to search, click or tap to add points. The tree lets a search skip far away points.</p>
    </header>
    <main class="stage padded"></main>
    <div class="controls">
      <button class="primary" id="add">Add random points</button>
      <button id="clear">Clear</button>
      <label><input type="checkbox" id="show-tree" checked /> Show tree</label>
    </div>
  </body>
</html>
