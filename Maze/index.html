<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maze · SketchBook</title>
    <meta name="description" content="Watch a maze being carved out, then solved by breadth-first search, depth-first search or A*." />
    <link rel="icon" href="../shared/favicon.svg" />
    <link rel="stylesheet" href="../shared/base.css" />
    <script defer src="../shared/fit-canvas.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body class="project">
    <header class="topbar">
      <a class="back" href="../">← All projects</a>
      <h1>Maze</h1>
      <span class="stat">Explored <output id="explored">0</output></span>
      <span class="stat">Path <output id="path">–</output></span>
      <p class="hint">Click or tap a cell to move the goal</p>
    </header>
    <main class="stage">
      <canvas id="canvas"></canvas>
    </main>
    <div class="controls">
      <label>
        Generator
        <select id="generator">
          <option value="backtracker">Recursive backtracker</option>
          <option value="prim">Prim's algorithm</option>
        </select>
      </label>
      <label>
        Solver
        <select id="solver">
          <option value="astar">A*</option>
          <option value="bfs">Breadth-first</option>
          <option value="dfs">Depth-first</option>
        </select>
      </label>
      <label>Cell size <input type="range" id="cell-size" min="12" max="48" step="4" value="24" /></label>
      <label>Speed <input type="range" id="speed" min="0" max="9" value="5" /></label>
      <button type="button" id="solve">Solve</button>
      <button class="primary" type="button" id="new-maze">New maze</button>
    </div>
  </body>
</html>
