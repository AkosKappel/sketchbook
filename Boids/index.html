<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boids · SketchBook</title>
    <meta name="description" content="Flocking birds from three local rules, with sliders for each one." />
    <link rel="icon" href="../shared/favicon.svg" />
    <link rel="stylesheet" href="../shared/base.css" />
    <script defer src="../lib/p5.min.js"></script>
    <script defer src="Boid.js"></script>
    <script defer src="sketch.js"></script>
  </head>
  <body class="project">
    <header class="topbar">
      <a class="back" href="../">← All projects</a>
      <h1>Boids</h1>
      <p class="hint">Three simple rules make a flock. Move your pointer or finger to scare it.</p>
    </header>
    <main class="stage"></main>
    <div class="controls">
      <label>Cohesion <input type="range" id="cohesion" min="0" max="0.02" step="0.001" value="0.005" /></label>
      <label>Separation <input type="range" id="separation" min="0" max="0.15" step="0.005" value="0.05" /></label>
      <label>Alignment <input type="range" id="alignment" min="0" max="0.15" step="0.005" value="0.05" /></label>
      <label>Vision <input type="range" id="vision" min="20" max="200" step="5" value="75" /></label>
      <label>Boids <input type="range" id="count" min="10" max="300" step="10" value="120" /></label>
      <label><input type="checkbox" id="trails" checked /> Show trails</label>
    </div>
  </body>
</html>
