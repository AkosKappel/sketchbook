<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fourier Series · SketchBook</title>
    <meta name="description" content="Spinning circles stacked on each other add up to a square wave." />
    <link rel="icon" href="../shared/favicon.svg" />
    <link rel="stylesheet" href="../shared/base.css" />
    <script defer src="../lib/p5.min.js"></script>
    <script defer src="sketch.js"></script>
  </head>
  <body class="project">
    <header class="topbar">
      <a class="back" href="../">← All projects</a>
      <h1>Fourier Series</h1>
      <p class="hint">Spinning circles add up sine waves until they approximate the chosen wave.</p>
    </header>
    <main class="stage"></main>
    <div class="controls">
      <label>
        Wave
        <select id="wave">
          <option value="square">Square</option>
          <option value="sawtooth">Sawtooth</option>
          <option value="triangle">Triangle</option>
        </select>
      </label>
      <label>
        Terms
        <input id="terms" type="range" min="1" max="50" value="5" />
        <span class="stat"><output id="terms-value">5</output></span>
      </label>
      <label>
        Speed
        <input id="speed" type="range" min="0.005" max="0.06" step="0.005" value="0.02" />
      </label>
    </div>
  </body>
</html>
